<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Dino Bowl — 8-bit football with dinosaurs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root { --field: #0a1f14; --accent: #ffd23f; } * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; background: radial-gradient(120% 90% at 50% -10%, #0e2a1b, var(--field) 60%); color: #f4f6f1; font-family: 'Press Start 2P', monospace; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); overflow: hidden; overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
    .frame { width: min(100%, calc((100vh - 70px) * 1.7778)); border: 3px solid #1d4030; border-radius: 4px; box-shadow: 0 12px 60px rgba(0,0,0,.55); background: #000; line-height: 0; }
    canvas { width: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; outline: none; cursor: crosshair; touch-action: none; }
    .bar { width: min(100%, calc((100vh - 70px) * 1.7778)); display: flex; justify-content: space-between; align-items: center; font-size: 9px; color: #9db0a4; }
    @media (max-width:700px) { .bar { font-size: 7px; } }
    /* dvh = the space Safari ACTUALLY shows (its URL bar makes 100vh lie,
       which was cutting off the bottom half of the field in landscape) */
    @supports (height: 100dvh) {
      html, body { min-height: 100dvh; }
      .frame { width: min(100%, calc((100dvh - 70px) * 1.7778)); }
    }
    /* phone in landscape: every vertical pixel goes to the game */
    @media (max-height: 520px) {
      html, body { padding: 2px; gap: 2px; }
      .bar { display: none; }
      .frame { width: min(100%, calc((100vh - 8px) * 1.7778)); border-width: 1px; box-shadow: none; }
      @supports (height: 100dvh) { .frame { width: min(100%, calc((100dvh - 8px) * 1.7778)); } }
    }
    /* fullscreen toggle — always in the top corner, portrait or landscape */
    #fsbtn { position: fixed; top: calc(6px + env(safe-area-inset-top, 0px)); right: calc(6px + env(safe-area-inset-right, 0px)); z-index: 60;
      background: rgba(5,12,8,.75); color: var(--accent); border: 2px solid #1d4030; border-radius: 8px;
      font-family: inherit; font-size: 16px; line-height: 1; padding: 9px 11px; cursor: pointer; touch-action: manipulation; }
    #fsbtn:active { background: #14402a; }
    /* pseudo-fullscreen layout (also the iOS fallback where the API is unavailable):
       kills the chrome and letterboxes the canvas to the whole viewport,
       surviving portrait ⇄ landscape rotation */
    body.fs { padding: 0; gap: 0; }
    body.fs .bar { display: none; }
    body.fs .frame { width: 100vw; height: 100vh; max-width: none; border: 0; border-radius: 0; box-shadow: none;
      display: flex; align-items: center; justify-content: center; background: #000; }
    body.fs canvas { width: min(100vw, calc(100vh * 1.7778)); }
    @supports (height: 100dvh) {
      body.fs .frame { height: 100dvh; }
      body.fs canvas { width: min(100dvw, calc(100dvh * 1.7778)); max-height: 100dvh; }
    }
  </style>
</head>
<body>
  <button id="fsbtn" aria-label="Toggle fullscreen">⛶</button>
  <div class="bar"><span>🦖 DINO BOWL</span><span id="online-status">ONLINE: CONNECTING</span><span>H = controls</span></div>
  <div class="frame"><canvas id="game" width="960" height="540" tabindex="0"></canvas></div>
  <script>
    // Fullscreen that STAYS on: native Fullscreen API where available (kept
    // across orientation changes by the browser), CSS pseudo-fullscreen as
    // the iPhone fallback — the .fs class persists through rotation either way.
    (function () {
      var btn = document.getElementById("fsbtn");
      var want = false;
      function fsEl() { return document.fullscreenElement || document.webkitFullscreenElement; }
      function apply() {
        document.body.classList.toggle("fs", want);
        btn.textContent = want ? "🗙" : "⛶";
      }
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        want = !want;
        var root = document.documentElement;
        try {
          if (want) {
            var rq = root.requestFullscreen || root.webkitRequestFullscreen;
            if (rq) rq.call(root);
            if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {});
          } else if (fsEl()) {
            (document.exitFullscreen || document.webkitExitFullscreen).call(document);
            if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
          }
        } catch (_) { /* pseudo-fullscreen still applies */ }
        apply();
      });
      ["fullscreenchange", "webkitfullscreenchange"].forEach(function (ev) {
        document.addEventListener(ev, function () {
          // user backed out via system UI → drop the layout too
          if (!fsEl() && want && !isMobileFallback()) { want = false; }
          apply();
        });
      });
      function isMobileFallback() {
        return !(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
      }
      // rotation must NOT drop fullscreen: reassert the layout after the turn
      window.addEventListener("orientationchange", function () { setTimeout(apply, 250); });
      window.addEventListener("resize", function () { if (want) apply(); });
    })();
  </script>
  <script src="/firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="/game/sprites.js?v=game-feel-compact-v28-tucked-ball-20260721"></script>
  <script src="/game/game.js?v=game-feel-compact-v28-tucked-ball-20260721"></script>
</body>
</html>
