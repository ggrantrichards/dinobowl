# Keeps gridiron-den.web.app current: every morning, pull the latest nflverse
# files, rebuild the season and game tables, and deploy the site.
#
# One-time setup: add a repository secret FIREBASE_SERVICE_ACCOUNT holding the
# JSON key of a service account on football-dino with the "Firebase Hosting
# Admin" role (Firebase console > Project settings > Service accounts).
name: Refresh stats

on:
  schedule:
    - cron: "0 11 * * *"   # 11:00 UTC, after nflverse's overnight update
  workflow_dispatch:        # "Run workflow" button for an on-demand refresh

concurrency: refresh-stats

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --only-binary=:all: -r requirements.txt

      # finished seasons never change, so keep their downloads between runs;
      # fetch_data.cached() re-downloads any season that was still in progress
      - uses: actions/cache@v4
        with:
          path: data/cache
          key: nflverse-${{ github.run_id }}
          restore-keys: nflverse-

      - run: python fetch_data.py
      - run: python build_games.py
      - run: python build_teams.py

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # the hosting predeploy (prepare_deploy.py) rebuilds data.json and games.json
      - run: npx --yes firebase-tools@15 deploy --only hosting:gridiron-den --project football-dino --non-interactive
